Packages:
  - Version: 1.2.3
    RequiredApiVersion: 2.8.0
    ReleaseDate: 2026-08-31
    PackageUrl: https://github.com/Whereis-Alice/Helium-Nova/releases/download/1.2.3/9c003378-5914-4a67-aa61-469eff798337_1_2_3.pthm
    Changelog:
      - Window background presets now recolour the whole interface instead of only the window gradients
      - Each preset drives 25 keys: top panel, sidebar, game list, list group headers, menus, filter panel, popups, scrollbars and generic control surfaces
      - Colours are hue-rotated with lightness preserved, so text contrast is identical to the original theme
  - Version: 1.2.2
    RequiredApiVersion: 2.8.0
    ReleaseDate: 2026-08-30
    PackageUrl: https://github.com/Whereis-Alice/Helium-Nova/releases/download/1.2.2/9c003378-5914-4a67-aa61-469eff798337_1_2_2.pthm
    Changelog:
      - The Details view artwork is now dimmed slightly out of the box, so descriptions, notes and link buttons stay readable over bright key art
      - Fixed a second upstream gap: the tint overlay was clipped to the header height, so the play row, description, links and custom fields below it were never dimmed at all
      - New DetailsViewSectionScrimBrush option dims the info section below the header artwork; transparent by default so the stock look is unchanged
      - New Gradient scrim backdrop preset fades the artwork from bright at the top to dark where the text starts, calms the blurred backdrop and strengthens the glass panels
      - New Off backdrop preset restores the original undimmed Helium look
  - Version: 1.2.1
    RequiredApiVersion: 2.8.0
    ReleaseDate: 2026-08-30
    PackageUrl: https://github.com/Whereis-Alice/Helium-Nova/releases/download/1.2.1/9c003378-5914-4a67-aa61-469eff798337_1_2_1.pthm
    Changelog:
      - Fixed DetailsViewCoverCornerRadius, which Helium declared but never applied, so the Details view cover stayed square under every rounding preset
      - The cover bitmap is now clipped by an opacity mask and its drop shadow follows the same radius
  - Version: 1.2.0
    RequiredApiVersion: 2.8.0
    ReleaseDate: 2026-08-30
    PackageUrl: https://github.com/Whereis-Alice/Helium-Nova/releases/download/1.2.0/9c003378-5914-4a67-aa61-469eff798337_1_2_0.pthm
    Changelog:
      - Details view background artwork opacity, blur strength and a tint overlay are now adjustable
      - New Background dimming preset group (Soft / Medium / Heavy) keeps the info panels readable over bright covers
      - The blurred backdrop opacity was previously hardcoded at 0.25 and could not be changed
  - Version: 1.1.0
    RequiredApiVersion: 2.8.0
    ReleaseDate: 2026-08-30
    PackageUrl: https://github.com/Whereis-Alice/Helium-Nova/releases/download/1.1.0/9c003378-5914-4a67-aa61-469eff798337_1_1_0.pthm
    Changelog:
      - Accent presets now recolour the whole accent surface instead of only five glyph keys
      - Gradient buttons, context buttons, progress bar, cover placeholders, menu hover, window border, popup border and tooltip tint all follow the accent
      - The nine accent presets moved from inline constants to dedicated resource dictionaries in Presets/Accent
      - Azure is now a lossless restatement of the original Helium palette so switching back is exact
  - Version: 1.0.0
    RequiredApiVersion: 2.8.0
    ReleaseDate: 2026-08-30
    PackageUrl: https://github.com/Whereis-Alice/Helium-Nova/releases/download/1.0.0/9c003378-5914-4a67-aa61-469eff798337_1_0_0.pthm
    Changelog:
      - Initial release, based on Helium 1.71 by darklinkpower
      - Full Theme Forge integration: 12 option groups, 152 declared options, 7 preset groups (31 presets)
      - English and Simplified Chinese theme option localization
      - Playnite Sounds Mod music player in Details view and Grid view
      - Resizable sidebar buttons and main menu logo with visibility toggle
      - Backwards compatible thememodifier.yaml kept for the legacy plugin
      - Declares recommended add-ons through extensions.yaml
