# Helium Nova - Theme Forge option schema
# Generated: keep in sync with Constants.xaml. Every Title/Description below is an
# English fallback; the localized text lives in Localization/<lang>.xaml.

Groups:
  - Id: topPanel
    Title: 'Top panel'
    LocKey: LOCHNGroupTopPanel
    Description: 'Search box, navigation buttons and top panel appearance.'
    DescriptionLocKey: LOCHNGroupDescTopPanel
    Order: 10
  - Id: sidebar
    Title: 'Sidebar'
    LocKey: LOCHNGroupSidebar
    Description: 'Sidebar logo and item sizing.'
    DescriptionLocKey: LOCHNGroupDescSidebar
    Order: 20
  - Id: detailsView
    Title: 'Details view'
    LocKey: LOCHNGroupDetailsView
    Description: 'Layout of the Details view game page.'
    DescriptionLocKey: LOCHNGroupDescDetailsView
    Order: 30
  - Id: gridDetails
    Title: 'Grid view - details'
    LocKey: LOCHNGroupGridDetails
    Description: 'The details panel shown next to the grid.'
    DescriptionLocKey: LOCHNGroupDescGridDetails
    Order: 40
  - Id: gridCovers
    Title: 'Grid view - covers'
    LocKey: LOCHNGroupGridCovers
    Description: 'Cover items inside the grid.'
    DescriptionLocKey: LOCHNGroupDescGridCovers
    Order: 50
  - Id: sectionOrder
    Title: 'Grid view - section order'
    LocKey: LOCHNGroupSectionOrder
    Description: 'Reorder the sections of the grid details panel. Lower numbers appear first.'
    DescriptionLocKey: LOCHNGroupDescSectionOrder
    Order: 60
  - Id: typography
    Title: 'Typography'
    LocKey: LOCHNGroupTypography
    Description: 'Fonts and font sizes.'
    DescriptionLocKey: LOCHNGroupDescTypography
    Order: 70
  - Id: palette
    Title: 'Colours'
    LocKey: LOCHNGroupPalette
    Description: 'Core colours the whole theme derives from.'
    DescriptionLocKey: LOCHNGroupDescPalette
    Order: 80
  - Id: controls
    Title: 'Controls & panels'
    LocKey: LOCHNGroupControls
    Description: 'Buttons, inputs, popups and panel surfaces.'
    DescriptionLocKey: LOCHNGroupDescControls
    Order: 90
  - Id: status
    Title: 'Status & ratings'
    LocKey: LOCHNGroupStatus
    Description: 'Colours used for install state, ratings and warnings.'
    DescriptionLocKey: LOCHNGroupDescStatus
    Order: 100
  - Id: shape
    Title: 'Shape & spacing'
    LocKey: LOCHNGroupShape
    Description: 'Corner radii and border thickness.'
    DescriptionLocKey: LOCHNGroupDescShape
    Order: 110
  - Id: integrations
    Title: 'Extension integrations'
    LocKey: LOCHNGroupIntegrations
    Description: 'Sections contributed by other extensions.'
    DescriptionLocKey: LOCHNGroupDescIntegrations
    Order: 120

